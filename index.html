<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year Progress 2026</title>
<!--
  Year Progress — live year progress bar
  Dark theme, zero dependencies, single-file HTML
  Inspired by dayleft (https://github.com/soumendrak/dayleft)
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --accent: #ff6b35;
    --accent-dim: #cc5529;
    --text: #e0e0e0;
    --text-dim: #888;
    --text-muted: #555;
    --bar-track: #2a2a2a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    max-width: 420px;
    width: 100%;
    background: var(--surface);
    border-radius: 28px;
    padding: 36px 32px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* subtle glow accent line at top */
  .container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 20%;
    right: 20%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    border-radius: 0 0 3px 3px;
  }

  .year {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--text);
    margin-bottom: 8px;
  }

  .year .leap-badge {
    font-size: 12px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
    vertical-align: middle;
    margin-left: 6px;
    letter-spacing: 0;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 28px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* --- Ring --- */
  .ring-wrapper {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto 18px;
  }

  .ring-wrapper svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: var(--bar-track);
    stroke-width: 8;
  }

  .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .ring-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 100%;
  }

  .ring-percent {
    font-size: 42px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    transition: opacity 0.4s ease;
  }

  .ring-percent .pct-sign {
    font-size: 20px;
    font-weight: 400;
    color: var(--text-dim);
  }

  .ring-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* --- Thin progress bar --- */
  .bar-section {
    margin: 16px 0 22px;
  }

  .bar-track {
    width: 100%;
    height: 4px;
    background: var(--bar-track);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* --- Stats grid --- */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }

  .stat-card {
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
    padding: 14px 6px;
    transition: background 0.2s;
  }

  .stat-card:hover {
    background: rgba(255,255,255,0.07);
  }

  .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }

  .stat-value.accent { color: var(--accent); }
  .stat-value.green  { color: #4caf7d; }
  .stat-value.blue   { color: #5b9bd5; }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* --- Footer --- */
  .footer {
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .footer a:hover {
    text-decoration: underline;
  }

  /* --- Responsive --- */
  @media (max-width: 460px) {
    .container { padding: 28px 18px 24px; border-radius: 20px; }
    .year { font-size: 34px; }
    .ring-wrapper { width: 160px; height: 160px; }
    .ring-percent { font-size: 34px; }
    .ring-percent .pct-sign { font-size: 16px; }
    .stat-value { font-size: 18px; }
    .stats { gap: 8px; }
    .stat-card { padding: 10px 4px; }
  }

  @media (max-width: 360px) {
    .ring-wrapper { width: 130px; height: 130px; }
    .ring-percent { font-size: 28px; }
    .stat-value { font-size: 15px; }
    .stats { gap: 5px; }
    .stat-card { padding: 8px 3px; border-radius: 10px; }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <div class="year">
    <span id="yearDisplay">2026</span>
    <span class="leap-badge" id="leapBadge" hidden>LEAP</span>
  </div>
  <div class="subtitle">Year Progress</div>

  <!-- Ring -->
  <div class="ring-wrapper">
    <svg viewBox="0 0 120 120" aria-label="Year progress ring">
      <circle class="ring-bg" cx="60" cy="60" r="52"/>
      <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"
              stroke-dasharray="326.726"
              stroke-dashoffset="326.726"/>
    </svg>
    <div class="ring-center">
      <div class="ring-percent" id="percentDisplay">0<span class="pct-sign">%</span></div>
      <div class="ring-label">elapsed</div>
    </div>
  </div>

  <!-- Thin bar -->
  <div class="bar-section">
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value blue" id="dayDisplay">1</div>
      <div class="stat-label">Day of Year</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="daysLeftDisplay">364</div>
      <div class="stat-label">Days Left</div>
    </div>
    <div class="stat-card">
      <div class="stat-value green" id="freeDaysDisplay">0</div>
      <div class="stat-label">Free Days</div>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/soumendrak/yearprogress" target="_blank" rel="noopener">yearprogress</a>
    &middot; zero dependencies &middot; live
  </div>
</div>

<script>
(function() {
  'use strict';

  const C = 2 * Math.PI * 52; // ~326.726
  const ringFg  = document.getElementById('ringFg');
  const barFill = document.getElementById('barFill');
  const yrEl    = document.getElementById('yearDisplay');
  const leapEl  = document.getElementById('leapBadge');
  const pctEl   = document.getElementById('percentDisplay');
  const dayEl   = document.getElementById('dayDisplay');
  const leftEl  = document.getElementById('daysLeftDisplay');
  const freeEl  = document.getElementById('freeDaysDisplay');

  function isLeap(y) {
    return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  }

  function daysInYear(y) {
    return isLeap(y) ? 366 : 365;
  }

  function getToday() {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const d = now.getDate();
    return { year: y, month: m, day: d, date: new Date(y, m, d) };
  }

  function dayOfYear(year, month, day) {
    // month is 0-indexed
    const start = new Date(year, 0, 0);
    const diff  = new Date(year, month, day) - start;
    return Math.floor(diff / 86400000);
  }

  function countFreeDaysRemaining(year, month, day) {
    // A "free day" = Saturday (6) or Sunday (0)
    let count = 0;
    const start = new Date(year, month, day + 1); // tomorrow
    const end   = new Date(year, 11, 31);
    // end inclusive
    let cur = new Date(start);
    while (cur <= end) {
      const dow = cur.getDay();
      if (dow === 0 || dow === 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  }

  function update() {
    const { year, month, day } = getToday();
    const total = daysInYear(year);
    const doy   = dayOfYear(year, month, day);
    const pct   = total > 0 ? doy / total : 0;
    const pctDisplay = Math.min(100, Math.round(pct * 100));
    const daysLeft = total - doy;
    const freeDays = countFreeDaysRemaining(year, month, day);

    // Year + leap badge
    yrEl.textContent = year;
    if (isLeap(year)) {
      leapEl.hidden = false;
    } else {
      leapEl.hidden = true;
    }

    // Ring
    const offset = C * (1 - pct);
    ringFg.setAttribute('stroke-dashoffset', offset);

    // Bar
    barFill.style.width = (pct * 100) + '%';

    // Percentage — safe: pctDisplay is a sanitized number (no user input), static span is controlled by us
    pctEl.innerHTML = pctDisplay + '<span class="pct-sign">%</span>';

    // Day of year
    dayEl.textContent = doy;

    // Days left
    leftEl.textContent = daysLeft;

    // Free days
    freeEl.textContent = freeDays;

    // Update document title
    document.title = pctDisplay + '% — Year Progress ' + year;
  }

  update();
  setInterval(update, 60000); // every 60 seconds — more than enough granularity
})();
</script>
</body>
</html>
